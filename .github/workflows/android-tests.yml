name: Android Unit Tests

on:
  pull_request:
    paths:
      - ".github/workflows/android-tests.yml"
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/android-tests.yml"
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

jobs:
  test:
    name: Local (JVM) unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      # Local unit tests only (app/src/test) — pure Kotlin/JVM, no device or
      # emulator needed. See G-33 in the capture-to-archive integrity audit:
      # this repo had zero Android test coverage and no Android CI at all
      # before this workflow. Instrumented tests (app/src/androidTest) would
      # need an emulator and aren't set up yet — deliberately out of scope
      # here rather than adding a slower, flakier CI job for a test source
      # set that doesn't exist yet.
      - name: Run local unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          retention-days: 14
