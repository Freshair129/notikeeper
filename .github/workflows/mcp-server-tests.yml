name: MCP Server Tests

on:
  pull_request:
    paths:
      - ".github/workflows/mcp-server-tests.yml"
      - "mcp-server/**"
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/mcp-server-tests.yml"
      - "mcp-server/**"
  workflow_dispatch:

jobs:
  test:
    name: node --test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: mcp-server

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # noise/graph/gate coverage plus, as of G-33 in the capture-to-archive
      # integrity audit, relations.mjs ETL/dedup coverage — all pure-logic,
      # no Ollama/GenesisBlock/live server required.
      - name: Run tests
        run: npm test
